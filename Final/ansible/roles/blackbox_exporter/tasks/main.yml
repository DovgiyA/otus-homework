---
# Role: blackbox_exporter - Prometheus blackbox exporter on monitoring host

- name: Create blackbox_exporter group
  ansible.builtin.group:
    name: blackbox_exporter
    system: yes

- name: Create blackbox_exporter user
  ansible.builtin.user:
    name: blackbox_exporter
    group: blackbox_exporter
    shell: /usr/sbin/nologin
    system: yes
    create_home: no

- name: Create Blackbox Exporter configuration directory
  ansible.builtin.file:
    path: /etc/blackbox_exporter
    state: directory
    owner: blackbox_exporter
    group: blackbox_exporter
    mode: '0755'

- name: Download Blackbox Exporter
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/blackbox_exporter/releases/download/v{{ blackbox_exporter_version }}/blackbox_exporter-{{ blackbox_exporter_version }}.linux-amd64.tar.gz"
    dest: "/tmp/blackbox_exporter-{{ blackbox_exporter_version }}.tar.gz"
    mode: '0644'

- name: Extract Blackbox Exporter
  ansible.builtin.unarchive:
    src: "/tmp/blackbox_exporter-{{ blackbox_exporter_version }}.tar.gz"
    dest: /tmp/
    remote_src: yes

- name: Copy Blackbox Exporter binary
  ansible.builtin.copy:
    src: "/tmp/blackbox_exporter-{{ blackbox_exporter_version }}.linux-amd64/blackbox_exporter"
    dest: /usr/local/bin/blackbox_exporter
    owner: blackbox_exporter
    group: blackbox_exporter
    mode: '0755'
    remote_src: yes
  notify: restart blackbox_exporter

- name: Deploy Blackbox configuration
  ansible.builtin.template:
    src: blackbox.yml.j2
    dest: /etc/blackbox_exporter/blackbox.yml
    owner: blackbox_exporter
    group: blackbox_exporter
    mode: '0644'
  notify: restart blackbox_exporter

- name: Create Blackbox Exporter systemd service
  ansible.builtin.template:
    src: blackbox_exporter.service.j2
    dest: /etc/systemd/system/blackbox_exporter.service
    mode: '0644'
  notify: restart blackbox_exporter

- name: Enable and start blackbox_exporter
  ansible.builtin.systemd:
    name: blackbox_exporter
    daemon_reload: yes
    enabled: yes
    state: started

- name: Clean up temporary files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/tmp/blackbox_exporter-{{ blackbox_exporter_version }}.tar.gz"
    - "/tmp/blackbox_exporter-{{ blackbox_exporter_version }}.linux-amd64"
