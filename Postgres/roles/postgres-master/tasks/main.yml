---
# Настройка PostgreSQL Master

- name: Deploy postgresql.conf for master
  template:
    src: postgresql.conf.j2
    dest: /etc/postgresql/14/main/postgresql.conf
    owner: postgres
    group: postgres
    mode: '0644'
  notify: Restart PostgreSQL Master

- name: Deploy pg_hba.conf for master
  template:
    src: pg_hba.conf.j2
    dest: /etc/postgresql/14/main/pg_hba.conf
    owner: postgres
    group: postgres
    mode: '0640'
  notify: Restart PostgreSQL Master

- name: Restart PostgreSQL to apply config
  systemd:
    name: postgresql
    state: restarted

- name: Wait for PostgreSQL to start
  wait_for:
    port: 5432
    delay: 5
    timeout: 30

- name: Create replication user
  become: yes
  become_user: postgres
  postgresql_user:
    name: replicator
    password: "ReplicaPass123"
    role_attr_flags: REPLICATION,LOGIN
    state: present

- name: Create barman user
  become: yes
  become_user: postgres
  postgresql_user:
    name: barman
    password: "BarmanPass123"
    role_attr_flags: SUPERUSER,LOGIN
    state: present

- name: Create replication slot
  become: yes
  become_user: postgres
  postgresql_query:
    query: "SELECT pg_create_physical_replication_slot('standby_slot') WHERE NOT EXISTS (SELECT 1 FROM pg_replication_slots WHERE slot_name = 'standby_slot');"

- name: Create test database
  become: yes
  become_user: postgres
  postgresql_db:
    name: testdb
    state: present

- name: Create test table
  become: yes
  become_user: postgres
  postgresql_query:
    db: testdb
    query: |
      CREATE TABLE IF NOT EXISTS test_table (
        id SERIAL PRIMARY KEY,
        name VARCHAR(100),
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
      );

- name: Insert test data
  become: yes
  become_user: postgres
  postgresql_query:
    db: testdb
    query: "INSERT INTO test_table (name) VALUES ('initial_data') ON CONFLICT DO NOTHING;"

- name: Ensure .ssh directory exists for postgres user
  become: yes
  file:
    path: /var/lib/postgresql/.ssh
    state: directory
    owner: postgres
    group: postgres
    mode: '0700'

- name: Generate SSH key for postgres user
  become: yes
  become_user: postgres
  openssh_keypair:
    path: /var/lib/postgresql/.ssh/id_rsa
    type: rsa
    size: 4096
    state: present
    force: no

- name: Fetch postgres public key from master
  become: yes
  become_user: postgres
  slurp:
    src: /var/lib/postgresql/.ssh/id_rsa.pub
  register: master_postgres_pub_key

- name: Save master postgres public key as fact
  set_fact:
    master_postgres_pub_key: "{{ master_postgres_pub_key.content | b64decode }}"
