---
# Role: grafana - Grafana with PostgreSQL backend, datasources, dashboards

- name: Download Grafana deb package
  ansible.builtin.get_url:
    url: "https://dl.grafana.com/oss/release/grafana_10.4.1_amd64.deb"
    dest: "/tmp/grafana_10.4.1_amd64.deb"
    mode: '0644'

- name: Install Grafana from deb package
  ansible.builtin.apt:
    deb: "/tmp/grafana_10.4.1_amd64.deb"
    state: present

- name: Configure Grafana
  ansible.builtin.template:
    src: grafana.ini.j2
    dest: /etc/grafana/grafana.ini
    owner: root
    group: grafana
    mode: '0640'
  notify: restart grafana

- name: Create provisioning directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: grafana
    group: grafana
    mode: '0755'
  loop:
    - /etc/grafana/provisioning/datasources
    - /etc/grafana/provisioning/dashboards
    - /var/lib/grafana/dashboards

- name: Deploy datasource provisioning
  ansible.builtin.template:
    src: datasources.yml.j2
    dest: /etc/grafana/provisioning/datasources/datasources.yml
    owner: grafana
    group: grafana
    mode: '0640'
  notify: restart grafana

- name: Deploy dashboard provisioning config
  ansible.builtin.copy:
    dest: /etc/grafana/provisioning/dashboards/dashboards.yml
    content: |
      apiVersion: 1
      providers:
        - name: 'default'
          orgId: 1
          folder: ''
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards
            foldersFromFilesStructure: false
    owner: grafana
    group: grafana
    mode: '0640'
  notify: restart grafana

- name: Deploy Node Exporter dashboard
  ansible.builtin.copy:
    src: dashboards/node_exporter.json
    dest: /var/lib/grafana/dashboards/node_exporter.json
    owner: grafana
    group: grafana
    mode: '0644'
  notify: restart grafana

- name: Deploy Logs dashboard
  ansible.builtin.copy:
    src: dashboards/logs_dashboard.json
    dest: /var/lib/grafana/dashboards/logs_dashboard.json
    owner: grafana
    group: grafana
    mode: '0644'
  notify: restart grafana

- name: Enable and start Grafana
  ansible.builtin.systemd:
    name: grafana-server
    daemon_reload: yes
    enabled: yes
    state: started

- name: Wait for Grafana to start
  ansible.builtin.uri:
    url: "http://localhost:3000/api/health"
    method: GET
    status_code: 200
  register: grafana_health
  retries: 15
  delay: 5
  until: grafana_health is succeeded

- name: Create admin user Alex
  ansible.builtin.uri:
    url: "http://localhost:3000/api/admin/users"
    method: POST
    user: admin
    password: "{{ grafana_admin_password }}"
    force_basic_auth: yes
    body_format: json
    body:
      name: "Alex"
      login: "{{ grafana_admin_user }}"
      password: "{{ grafana_admin_password }}"
      OrgId: 1
      role: "Admin"
    status_code: [200, 412]
  register: create_user_result
  ignore_errors: yes

- name: Update default admin password
  ansible.builtin.uri:
    url: "http://localhost:3000/api/user/password"
    method: PUT
    user: admin
    password: admin
    force_basic_auth: yes
    body_format: json
    body:
      oldPassword: "admin"
      newPassword: "{{ grafana_admin_password }}"
    status_code: [200, 400, 401]
  ignore_errors: yes
