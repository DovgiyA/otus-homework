---
- name: Create blackbox_exporter user
  ansible.builtin.user:
    name: blackbox_exporter
    shell: /usr/sbin/nologin
    system: true
    create_home: false

- name: Create config directory
  ansible.builtin.file:
    path: /etc/blackbox_exporter
    state: directory
    owner: blackbox_exporter
    group: blackbox_exporter
    mode: "0755"

- name: Check if blackbox_exporter is installed
  ansible.builtin.stat:
    path: /usr/local/bin/blackbox_exporter
  register: bb_binary

- name: Download blackbox_exporter
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/blackbox_exporter/releases/download/v{{ blackbox_exporter_version }}/blackbox_exporter-{{ blackbox_exporter_version }}.linux-amd64.tar.gz"
    dest: /tmp/blackbox_exporter.tar.gz
    mode: "0644"
  when: not bb_binary.stat.exists

- name: Extract blackbox_exporter
  ansible.builtin.unarchive:
    src: /tmp/blackbox_exporter.tar.gz
    dest: /tmp
    remote_src: true
  when: not bb_binary.stat.exists

- name: Install blackbox_exporter binary
  ansible.builtin.copy:
    src: "/tmp/blackbox_exporter-{{ blackbox_exporter_version }}.linux-amd64/blackbox_exporter"
    dest: /usr/local/bin/blackbox_exporter
    mode: "0755"
    remote_src: true
  when: not bb_binary.stat.exists
  notify: restart blackbox_exporter

- name: Deploy blackbox_exporter config
  ansible.builtin.template:
    src: blackbox.yml.j2
    dest: /etc/blackbox_exporter/blackbox.yml
    owner: blackbox_exporter
    group: blackbox_exporter
    mode: "0640"
  notify: restart blackbox_exporter

- name: Deploy blackbox_exporter systemd service
  ansible.builtin.template:
    src: blackbox_exporter.service.j2
    dest: /etc/systemd/system/blackbox_exporter.service
    mode: "0644"
  notify: restart blackbox_exporter

- name: Enable and start blackbox_exporter
  ansible.builtin.systemd:
    name: blackbox_exporter
    state: started
    enabled: true
    daemon_reload: true

- name: Clean up temp files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/blackbox_exporter.tar.gz
    - "/tmp/blackbox_exporter-{{ blackbox_exporter_version }}.linux-amd64"
