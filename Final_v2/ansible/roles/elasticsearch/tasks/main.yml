---
- name: Import Elasticsearch GPG key from keyserver
  ansible.builtin.shell: |
    gpg --keyserver keyserver.ubuntu.com --recv-keys D88E42B4 && \
    gpg --export D88E42B4 > /usr/share/keyrings/elasticsearch-archive-keyring.gpg
  args:
    creates: /usr/share/keyrings/elasticsearch-archive-keyring.gpg

- name: Add Elasticsearch repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/elasticsearch-archive-keyring.gpg] https://mirror.yandex.ru/mirrors/elastic/{{ elasticsearch_version }}/ stable main"
    state: present
    filename: elasticsearch

- name: Install Elasticsearch
  ansible.builtin.apt:
    name: elasticsearch
    state: present
    update_cache: true

- name: Deploy Elasticsearch config
  ansible.builtin.template:
    src: elasticsearch.yml.j2
    dest: /etc/elasticsearch/elasticsearch.yml
    owner: root
    group: elasticsearch
    mode: "0660"
  notify: restart elasticsearch

- name: Set JVM heap size
  ansible.builtin.copy:
    dest: /etc/elasticsearch/jvm.options.d/heap.options
    content: |
      -Xms512m
      -Xmx512m
    mode: "0644"
  notify: restart elasticsearch

- name: Enable and start Elasticsearch
  ansible.builtin.systemd:
    name: elasticsearch
    state: started
    enabled: true
    daemon_reload: true

- name: Flush handlers to apply config changes
  ansible.builtin.meta: flush_handlers

- name: Wait for Elasticsearch to be ready
  ansible.builtin.uri:
    url: "http://localhost:9200/_cluster/health"
    method: GET
    status_code: 200
  register: es_health
  until: es_health.status == 200
  retries: 30
  delay: 5

- name: Create ILM policy for log rotation
  ansible.builtin.uri:
    url: "http://localhost:9200/_ilm/policy/fluentd-policy"
    method: PUT
    body_format: json
    body:
      policy:
        phases:
          hot:
            actions:
              rollover:
                max_age: "1d"
                max_size: "5gb"
          delete:
            min_age: "{{ log_retention_days }}d"
            actions:
              delete: {}
    status_code: [200]
  register: ilm_result
  failed_when: false
  changed_when: ilm_result.status == 200
