---
- name: Install certbot
  ansible.builtin.apt:
    name:
      - certbot
      - python3-certbot-nginx
    state: present

- name: Check if certificate exists
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ domain_name }}/fullchain.pem"
  register: cert_file

- name: Flush handlers to ensure Nginx HTTP config is active
  ansible.builtin.meta: flush_handlers

- name: Obtain SSL certificate
  ansible.builtin.command: >
    certbot certonly --nginx
    -d {{ domain_name }} -d {{ domain_name_www }}
    --non-interactive --agree-tos
    --email {{ certbot_email }}
  args:
    creates: "/etc/letsencrypt/live/{{ domain_name }}/fullchain.pem"
  when: not cert_file.stat.exists

- name: Deploy Nginx SSL config
  ansible.builtin.template:
    src: "../frontend/templates/nginx-speedtest.conf.j2"
    dest: /etc/nginx/sites-available/speedtest.conf
    mode: "0644"
  notify: reload nginx certbot

- name: Validate Nginx config
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Setup certbot auto-renewal
  ansible.builtin.cron:
    name: "certbot renew"
    job: "certbot renew --quiet --post-hook 'systemctl reload nginx'"
    hour: "3"
    minute: "30"
    weekday: "1"
