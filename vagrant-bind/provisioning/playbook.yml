# Client (192.168.50.15) configuration
- hosts: client
  become: yes
  tasks:
    - name: Copy client resolv.conf
      copy:
        src: client-resolv.conf
        dest: /etc/resolv.conf
        owner: root
        group: root
        mode: '0644'

    - name: Copy rndc.conf
      copy:
        src: rndc.conf
        dest: /home/vagrant/rndc.conf
        owner: vagrant
        group: vagrant
        mode: '0644'

    - name: Copy client motd
      copy:
        src: client-motd
        dest: /etc/motd
        owner: root
        group: root
        mode: '0644'

