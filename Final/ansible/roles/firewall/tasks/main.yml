---
# Role: firewall - UFW configuration per host

- name: Reset UFW to defaults
  community.general.ufw:
    state: reset

- name: Set default deny incoming
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Set default allow outgoing
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Allow configured ports
  community.general.ufw:
    rule: allow
    port: "{{ item.port | string }}"
    proto: "{{ item.proto }}"
    from_ip: "{{ item.from | default('any') }}"
    comment: "Allow {{ item.port }}/{{ item.proto }} from {{ item.from | default('any') }}"
  loop: "{{ firewall_allowed_ports }}"

- name: Enable UFW
  community.general.ufw:
    state: enabled

- name: Enable UFW logging
  community.general.ufw:
    logging: "on"
