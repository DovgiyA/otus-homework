- name: Configure LDAP SSH key authentication
  hosts: ipa_server
  become: true
  vars:
    ipa_admin_password: AdminPassw0rd!
    ldap_ssh_user: ldapuser
    ldap_ssh_public_key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQDCexampleGeneratedKeyReplaceMe user@local"
  tasks:
    - name: Ensure user exists in FreeIPA
      ansible.builtin.shell: |
        kinit admin <<< '{{ ipa_admin_password }}'
        ipa user-show {{ ldap_ssh_user }} || ipa user-add {{ ldap_ssh_user }} --first LDAP --last User --password <<< 'TempPassw0rd!'
      args:
        executable: /bin/bash
      changed_when: false

    - name: Add SSH public key to LDAP user
      ansible.builtin.shell: |
        kinit admin <<< '{{ ipa_admin_password }}'
        ipa user-mod {{ ldap_ssh_user }} --sshpubkey='{{ ldap_ssh_public_key }}'
      args:
        executable: /bin/bash
      changed_when: true

- name: Configure client sshd to use SSSD authorized keys
  hosts: ipa_client
  become: true
  tasks:
    - name: Ensure required package is installed
      ansible.builtin.dnf:
        name: openssh-server
        state: present

    - name: Configure sshd authorized keys command
      ansible.builtin.blockinfile:
        path: /etc/ssh/sshd_config
        block: |
          AuthorizedKeysCommand /usr/bin/sss_ssh_authorizedkeys
          AuthorizedKeysCommandUser nobody
        marker: "# {mark} ANSIBLE MANAGED BLOCK LDAP SSH KEYS"
      notify: Restart sshd

    - name: Ensure sssd is running
      ansible.builtin.service:
        name: sssd
        state: started
        enabled: true

  handlers:
    - name: Restart sshd
      ansible.builtin.service:
        name: sshd
        state: restarted
