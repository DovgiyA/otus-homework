options {
    listen-on port 53 { 192.168.50.10; };
    listen-on-v6 port 53 { ::1; };

    directory "/var/named";
    dump-file "/var/named/data/cache_dump.db";
    statistics-file "/var/named/data/named_stats.txt";
    memstatistics-file "/var/named/data/named_mem_stats.txt";

    recursion yes;
    allow-query { any; };
    allow-transfer { 192.168.50.11; };

    bindkeys-file "/etc/named.iscdlv.key";
    managed-keys-directory "/var/named/dynamic";
    pid-file "/run/named/named.pid";
    session-keyfile "/run/named/session.key";
};

logging {
    channel default_debug {
        file "data/named.run";
        severity dynamic;
    };
};

// RNDC Control
key "rndc-key" {
    algorithm hmac-md5;
    secret "GrtiE9kz16GK+OKKU/qJvQ==";
};

controls {
    inet 192.168.50.10 allow { 192.168.50.15; 192.168.50.16; } keys { "rndc-key"; };
};

// ZONE TRANSFER WITH TSIG
include "/etc/named.zonetransfer.key";

server 192.168.50.11 {
    keys { "zonetransfer.key"; };
};

// ACLs for split-dns
acl "client1" { 192.168.50.15; };
acl "client2" { 192.168.50.16; };

// VIEW 1: For client1 (192.168.50.15)
// Sees: dns.lab (web1 only) and newdns.lab (www only)
view "client1_view" {
    match-clients { client1; };

    recursion yes;

    zone "dns.lab" {
        type master;
        file "/etc/named/named.dns.lab.client1";
        allow-transfer { 192.168.50.11; };
        also-notify { 192.168.50.11; };
    };

    zone "newdns.lab" {
        type master;
        file "/etc/named/named.newdns.lab.client1";
        allow-transfer { 192.168.50.11; };
        also-notify { 192.168.50.11; };
    };
};

// VIEW 2: For client2 (192.168.50.16)
// Sees: dns.lab (web2 only) - does NOT see newdns.lab
view "client2_view" {
    match-clients { client2; };

    recursion yes;

    zone "dns.lab" {
        type master;
        file "/etc/named/named.dns.lab.client2";
        allow-transfer { 192.168.50.11; };
        also-notify { 192.168.50.11; };
    };
};

// VIEW 3: Default view (for others and slave)
// Sees: All zones - dns.lab (full), newdns.lab (full), ddns.lab
view "default_view" {
    match-clients { any; };

    recursion yes;

    zone "dns.lab" {
        type master;
        file "/etc/named/named.dns.lab";
        allow-transfer { 192.168.50.11; };
        also-notify { 192.168.50.11; };
    };

    zone "newdns.lab" {
        type master;
        file "/etc/named/named.newdns.lab";
        allow-transfer { 192.168.50.11; };
        also-notify { 192.168.50.11; };
    };

    zone "ddns.lab" {
        type master;
        file "/etc/named/named.ddns.lab";
        allow-update { key "rndc-key"; };
        allow-transfer { 192.168.50.11; };
        also-notify { 192.168.50.11; };
    };

    zone "50.168.192.in-addr.arpa" {
        type master;
        file "/etc/named/named.dns.lab.rev";
        allow-transfer { 192.168.50.11; };
        also-notify { 192.168.50.11; };
    };
};
