---
# Role: pg_standby - PostgreSQL streaming replication standby

- name: Install PostgreSQL repository key
  ansible.builtin.apt_key:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    state: present

- name: Add PostgreSQL repository
  ansible.builtin.apt_repository:
    repo: "deb http://apt.postgresql.org/pub/repos/apt {{ ansible_distribution_release }}-pgdg main"
    state: present
    filename: pgdg

- name: Install PostgreSQL {{ postgresql_version }}
  ansible.builtin.apt:
    name:
      - "postgresql-{{ postgresql_version }}"
      - "postgresql-client-{{ postgresql_version }}"
      - python3-psycopg2
    state: present
    update_cache: yes

- name: Stop PostgreSQL for standby setup
  ansible.builtin.systemd:
    name: postgresql
    state: stopped

- name: Remove existing data directory
  ansible.builtin.file:
    path: "/var/lib/postgresql/{{ postgresql_version }}/main"
    state: absent

- name: Create .pgpass for replication
  ansible.builtin.copy:
    dest: /var/lib/postgresql/.pgpass
    content: "{{ db_primary_ip }}:5432:replication:{{ pg_replicator_user }}:{{ pg_replicator_password }}"
    owner: postgres
    group: postgres
    mode: '0600'

- name: Run pg_basebackup from primary
  become: true
  become_user: postgres
  ansible.builtin.command:
    cmd: >
      pg_basebackup
      -h {{ db_primary_ip }}
      -U {{ pg_replicator_user }}
      -D /var/lib/postgresql/{{ postgresql_version }}/main
      -Fp -Xs -P -R
      -S standby_slot
  environment:
    PGPASSWORD: "{{ pg_replicator_password }}"
  args:
    creates: "/var/lib/postgresql/{{ postgresql_version }}/main/PG_VERSION"

- name: Configure standby postgresql.conf
  ansible.builtin.template:
    src: postgresql_standby.conf.j2
    dest: "/etc/postgresql/{{ postgresql_version }}/main/postgresql.conf"
    owner: postgres
    group: postgres
    mode: '0644'
  notify: restart postgresql standby

- name: Start PostgreSQL standby
  ansible.builtin.systemd:
    name: postgresql
    enabled: yes
    state: started

- name: Verify standby is in recovery mode
  become: true
  become_user: postgres
  ansible.builtin.command:
    cmd: psql -c "SELECT pg_is_in_recovery();"
  register: recovery_check
  changed_when: false
  retries: 3
  delay: 5
