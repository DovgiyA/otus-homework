---
# Role: kibana - Kibana for log visualization

- name: Install Kibana
  ansible.builtin.apt:
    name: kibana
    state: present
    update_cache: yes

- name: Configure Kibana
  ansible.builtin.template:
    src: kibana.yml.j2
    dest: /etc/kibana/kibana.yml
    owner: root
    group: kibana
    mode: '0660'
  notify: restart kibana

- name: Enable and start Kibana
  ansible.builtin.systemd:
    name: kibana
    daemon_reload: yes
    enabled: yes
    state: started
