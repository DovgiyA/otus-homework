---
# Server role - configure default gateway via inetRouter
- name: Ensure NAT route through vagrant interface is removed
  shell: |
    ip route del default 2>/dev/null || true
  ignore_errors: yes
  changed_when: false

- name: Configure default gateway via inetRouter
  shell: |
    ip route add default via {{ inet_router_ip }} dev eth1
  ignore_errors: yes
  changed_when: false

- name: Create route persistence script
  copy:
    content: |
      #!/bin/bash
      ip route del default 2>/dev/null || true
      ip route add default via {{ inet_router_ip }} dev eth1
    dest: /usr/local/sbin/restore-routes
    mode: '0755'
    owner: root
    group: root

- name: Create systemd service for route persistence
  copy:
    content: |
      [Unit]
      Description=Restore default gateway
      After=network.target

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/restore-routes
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/restore-routes.service
    mode: '0644'
    owner: root
    group: root

- name: Enable route persistence service
  systemd:
    name: restore-routes
    enabled: yes
    daemon_reload: yes
